{% extends "base.html" %} 
{% block head %}
  <link rel="preload" href="/documents/list.css" as="style">
  <link rel="stylesheet" href="/documents/list.css">
{% endblock %}
{% block title %}Registros{% endblock %}
{% block main %}  
      <section>
          <ol>
          {% for page in section.pages %}
              <li>
                <span>{{ page.date }}</span> —
                <a href="{{ page.url }}.html">{{ page.title }}</a>
              </li>
          {% endfor %}
          </ol>
      </section>
{% endblock %}

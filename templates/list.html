{% extends "base.html" %} 
{% block head %}
  <link rel="preload" href="/documents/list.css" as="style">
  <link rel="stylesheet" href="/documents/list.css">
{% endblock %}
{% block main %}  
      <section>
          {% for page in section.pages %}
              <article>
                <header>
                  <h2><a href="{{ page.url }}.html">{{ page.title }}</a></h2>
                </header>
                {{ page.content | safe }}
                <footer>
                  <em>{{ page.date }}</em>
                </footer>
              </article>
          {% endfor %}
      </section>
{% endblock %}
